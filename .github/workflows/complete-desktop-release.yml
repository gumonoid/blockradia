name: Add macOS and Linux packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with a verified Windows package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: complete-desktop-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node -e "if ('v'+require('./package.json').version!==process.env.RELEASE_TAG || require('./package.json').version!==require('./desktop/package.json').version) process.exit(1)"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm --prefix desktop run package:${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: blockradia-${{ matrix.platform }}
          path: release/BlockRadia-*
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: blockradia-*
          path: release-assets
          merge-multiple: true
      - name: Verify package set and upload platform assets
        run: |
          gh release download "$RELEASE_TAG" --pattern BlockRadia-Windows-x64.exe --dir release-assets
          node scripts/checksums.mjs release-assets
          gh release upload "$RELEASE_TAG" release-assets/BlockRadia-macOS-* release-assets/BlockRadia-Linux-*
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt --clobber
