name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      unsigned:
        description: Publish without publisher or checksum signatures
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm run build
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: npm --prefix desktop run package:linux
      - name: Package Windows
        if: matrix.platform == 'windows' && inputs.unsigned
        run: npm --prefix desktop run package:win
      - name: Package macOS
        if: matrix.platform == 'macos' && inputs.unsigned
        working-directory: desktop
        run: npx --no-install electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Sign and verify Windows executable
        if: matrix.platform == 'windows' && !inputs.unsigned
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:WIN_CSC_LINK -or !$env:WIN_CSC_KEY_PASSWORD) { throw "Missing Windows signing credentials" }
          npm --prefix desktop run package:win -- --config.win.signAndEditExecutable=true --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature -FilePath release/BlockRadia-Windows-x64.exe
          if ($signature.Status -ne 'Valid') { throw "Windows signature verification failed" }
      - name: Sign, notarize and verify macOS packages
        if: matrix.platform == 'macos' && !inputs.unsigned
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ vars.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          : "${CSC_LINK:?Missing Developer ID certificate}" "${CSC_KEY_PASSWORD:?Missing certificate password}"
          : "${MAC_SIGNING_IDENTITY:?Missing Developer ID identity}"
          : "${APPLE_ID:?Missing Apple ID}" "${APPLE_APP_SPECIFIC_PASSWORD:?Missing notarization password}" "${APPLE_TEAM_ID:?Missing team ID}"
          (cd desktop && npx --no-install electron-builder --mac dmg zip --"$ARCH" --publish never "--config.mac.identity=$MAC_SIGNING_IDENTITY" --config.mac.hardenedRuntime=true --config.mac.notarize=true --config.dmg.sign=true --config.forceCodeSigning=true)
          temp=$(mktemp -d)
          ditto -x -k "release/BlockRadia-macOS-$ARCH.zip" "$temp"
          codesign --verify --deep --strict "$temp/BlockRadia.app"
          xcrun stapler validate "$temp/BlockRadia.app"
          codesign --verify "release/BlockRadia-macOS-$ARCH.dmg"
      - name: Check first launch on Windows
        if: matrix.platform == 'windows'
        run: node scripts/desktop-smoke.mjs release/win-unpacked/BlockRadia.exe
      - name: Check first launch from the Linux archive
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          temp=$(mktemp -d)
          tar -xzf release/BlockRadia-Linux-x64.tar.gz -C "$temp"
          executable=$(find "$temp" -type f -name blockradia-desktop -print -quit)
          test -n "$executable"
          xvfb-run -a node scripts/desktop-smoke.mjs "$executable"
      - name: Check first launch from macOS downloads
        if: matrix.platform == 'macos'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          volume=$(mktemp -d)
          archive=$(mktemp -d)
          hdiutil attach "release/BlockRadia-macOS-$ARCH.dmg" -mountpoint "$volume" -nobrowse -readonly
          trap 'hdiutil detach "$volume"; rm -rf "$archive"' EXIT
          node scripts/desktop-smoke.mjs "$volume/BlockRadia.app/Contents/MacOS/BlockRadia"
          ditto -x -k "release/BlockRadia-macOS-$ARCH.zip" "$archive"
          node scripts/desktop-smoke.mjs "$archive/BlockRadia.app/Contents/MacOS/BlockRadia"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blockradia-${{ matrix.os }}
          path: release/BlockRadia-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: blockradia-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        env:
          ALLOW_UNSIGNED_CHECKSUMS: ${{ inputs.unsigned && '1' || '0' }}
          RELEASE_CHECKSUM_PRIVATE_KEY: ${{ !inputs.unsigned && secrets.RELEASE_CHECKSUM_PRIVATE_KEY || '' }}
        run: node scripts/checksums.mjs release-assets
      - name: Publish verified desktop packages
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$(node -p "require('./desktop/package.json').version")" ]; then
            echo "The root and desktop versions must match."
            exit 1
          fi
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists. Use a new version or resolve the existing draft."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Use a new version."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          mapfile -t assets < <(awk '{print "release-assets/" $2}' release-assets/SHA256SUMS.txt)
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "BlockRadia ${tag#v} — Desktop" --notes-file docs/RELEASE_NOTES.md
          if [ -f release-assets/SHA256SUMS.txt.sig ]; then assets+=(release-assets/SHA256SUMS.txt.sig); fi
          gh release upload "$tag" "${assets[@]}" release-assets/SHA256SUMS.txt
          gh release edit "$tag" --draft=false --latest
