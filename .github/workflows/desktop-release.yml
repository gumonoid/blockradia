name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: Optional completed run whose Windows and Linux artifacts should be reused
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.reuse_run && '[{"os":"macos-15-intel","platform":"macos","command":"package:mac"}]' || '[{"os":"windows-latest","platform":"windows","command":"package:win"},{"os":"macos-15-intel","platform":"macos","command":"package:mac"},{"os":"ubuntu-latest","platform":"linux","command":"package:linux"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm run build
      - name: Package ${{ matrix.platform }}
        run: npm --prefix desktop run ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chainlens-${{ matrix.platform }}
          path: release/Chainlens-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chainlens-*
          path: release-assets
          merge-multiple: true
      - name: Reuse completed Windows and Linux packages
        if: ${{ inputs.reuse_run }}
        env:
          REUSE_RUN: ${{ inputs.reuse_run }}
        shell: bash
        run: |
          [[ "$REUSE_RUN" =~ ^[0-9]+$ ]] || exit 1
          reuse_sha=$(gh api "repos/$GH_REPO/actions/runs/$REUSE_RUN" --jq '.head_sha')
          [[ "$reuse_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --no-tags origin "$reuse_sha"
          git diff --exit-code "$reuse_sha" HEAD -- app components lib desktop package.json package-lock.json tsconfig.json
          gh run download "$REUSE_RUN" --name chainlens-windows --dir release-assets
          gh run download "$REUSE_RUN" --name chainlens-linux --dir release-assets
      - name: Verify all platforms and generate checksums
        run: node scripts/checksums.mjs release-assets
      - name: Publish private repository release
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          existing=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.draft' 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "Release $tag is already published; increase the package version before publishing again."
            exit 1
          fi
          if [ "$existing" != "true" ]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Chainlens ${tag#v} — Desktop" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
