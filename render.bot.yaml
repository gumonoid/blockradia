services:
  - type: web
    name: blockradia-chat-bot
    branch: feature/telegram-chat-bot
    runtime: docker
    dockerfilePath: ./Dockerfile.bot
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BLOCKRADIA_API_URL
        value: https://blockradia-api.onrender.com
